vehicle:
  id: 8
  team_id: 1
  type: COPTER
protocol:
  start_byte: 84
  start_byte_2: 199
  version: 2
  compression_enabled: true
  compression_threshold: 128
interface:
  comm_type: UDP
uart:
  port: /dev/ttyUSB2
  baudrate: 57600
  timeout: 1
udp:
  local_ip: 0.0.0.0
  local_port: 5001
  remote_ip: 239.1.2.3
  remote_port: 5001
  idle_sleep_sec: 0.0002
  rcvbuf_bytes: 16777216
  rx_queue_size: 75
  enable_loopback: true
logging:
  enabled: true
  level: INFO
  clear_on_start: true
  write_to_file: true
ack:
  mode: unicast
telemetry_monitor:
  enabled: true
  interval_sec: 1.0
  file_path: logs/telemetry_monitor_node_8.log
security:
  enabled: true
  key: '9999999999999999999999999999999999999999999999999999999999999999'
relay:
  enabled: true
  max_hops: 2
  delay_ms: 10
  allowed_types:
  - C
  - A
  - R
  - E
event:
  enabled: true
  redundancy:
    critical:
      count: 3
      delays_ms: [0, 50, 150]
    high:
      count: 2
      delays_ms: [0, 100]
    normal:
      count: 1
      delays_ms: [0]
    low:
      count: 1
      delays_ms: [0]
  rate_limit:
    critical: 10
    high: 5
    normal: 2
    low: 1
  cache:
    ttl_seconds: 60
    max_size: 1000
